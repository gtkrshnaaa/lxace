services:
  lxace:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lxace-engine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - .:/workspace
    deploy:
      resources:
        limits:
          # Derived from the host by scripts/sh/derive-caps.sh, so the 50% policy holds on
          # any machine instead of only on an 8-core / 7GB workstation.
          cpus: "${DOCKER_CPUS:-2.0}"
          memory: "${DOCKER_MEM:-3500M}"
        reservations:
          cpus: "0.5"
          memory: "256M"

  lxace-tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lxace-tests
    entrypoint: ["/usr/local/bin/lxace_tests"]
    profiles:
      - test
    deploy:
      resources:
        limits:
          cpus: "${DOCKER_CPUS:-2.0}"
          memory: "${DOCKER_MEM:-3500M}"
