services:
  lxace:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lxace-engine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - .:/workspace
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 3500M
        reservations:
          cpus: "1.0"
          memory: 512M

  lxace-tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lxace-tests
    entrypoint: ["/usr/local/bin/lxace_tests"]
    profiles:
      - test
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 3500M
